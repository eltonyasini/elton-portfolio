name: Optimize portfolio covers
on:
  push:
    branches: [main]
    paths:
      - 'site/media/manual-cover-*.png'
      - '.github/workflows/optimize-portfolio-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate lightweight responsive WebP covers
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps
          root=Path("site/media")
          files=list(root.glob("manual-cover-*.png"))
          for f in files:
              with Image.open(f) as source:
                  image=ImageOps.exif_transpose(source).convert("RGB")
                  for width,suffix,quality in [(900,"-preview",76),(1400,"-large",80)]:
                      im=image.copy()
                      if im.width>width:
                          im.thumbnail((width,9999),Image.Resampling.LANCZOS)
                      out=f.with_name(f.stem+suffix+".webp")
                      im.save(out,format="WEBP",quality=quality,method=6)
                      print(out,round(out.stat().st_size/1024),"KiB")
          PY
      - name: Commit generated WebP images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media/*-preview.webp site/media/*-large.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized WebP thumbnails for portfolio grid"
            git push
          fi
