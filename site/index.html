<link rel="stylesheet" href="/elton-portfolio/assets/portfolio-refinement.css?v=static-roles-20261028"></head><body><div id="portfolio-intro" aria-hidden="true"><div><span>Elton</span><span>Yasini</span></div></div>
<script>
(()=>{
  const el=document.getElementById('portfolio-intro');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const projectRoute=/^#\/(?:work\/|project\/)/.test(location.hash) || /\/work\//.test(location.pathname);
  const replay=new URLSearchParams(location.search).has('replayIntro');
  let alreadySeen=false;
  try {
    alreadySeen=sessionStorage.getItem('portfolio-intro-seen-v2')==='1';
  } catch {}
  if (reduced || projectRoute || (alreadySeen && !replay)) {
    el.hidden=true;
    return;
  }
  document.documentElement.classList.add('portfolio-intro-active');
  try {sessionStorage.setItem('portfolio-intro-seen-v2','1')} catch {}
  window.portfolioIntroTimeout=setTimeout(()=>{
    el.remove();
    document.documentElement.classList.remove('portfolio-intro-active');
    window.dispatchEvent(new Event('portfolio:intro-complete'));
  },5500);
})();
</script><div id="root"></div><noscript>Please enable JavaScript to explore the selected work.</noscript></body></html>
